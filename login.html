<!DOCTYPE html>
<html lang="es">
<head>
 <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">

</head>
<body class="bg-gray-100">

  <!-- Menú de navegación -->
  <header>
    <nav class="flex justify-between items-center bg-blue-600 p-4 text-white">
      <h1 class="text-xl font-bold">Lavadero Juan</h1>
      <div class="flex gap-4">
        <a href="index.html" class="hover:text-yellow-300 transition">Home</a>
        <a href="register.html" class="hover:text-yellow-300 transition">Register</a>
        <a href="Lavados.html" class="hover:text-yellow-300 transition">Servicios</a>
        <a href="Contacto.html" class="hover:text-yellow-300 transition">Contacto</a>
      </div>
    </nav>
  </header>

  <!-- Formulario Login -->
  <section class="flex justify-center items-center h-screen">
    <form action="index.html" class="bg-white p-6 rounded shadow-md w-96 flex flex-col gap-4">
      <h1 class="text-2xl font-bold text-center">Formulario Login</h1>

      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" class="border p-2 rounded">

      <label for="contraseña">Contraseña</label>
      <input type="password" id="contraseña" class="border p-2 rounded">

      <label for="edad">Edad</label>
      <input type="number" id="edad" class="border p-2 rounded">

      <label for="opciones">Lista de selección</label>
      <select id="opciones" class="border p-2 rounded">
        <optgroup label="Principales">
          <option value="opcion1" selected>Primera</option>
          <option value="opcion2">Segunda</option>
        </optgroup>
        <optgroup label="Otras">
          <option value="opcion3">Tercera</option>
          <option value="opcion4">Cuarta</option>
        </optgroup>
      </select>

      <button class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Logear</button>
    </form>
  </section>

  <!-- Recuperar contraseña -->
  <section class="text-center mt-4">
    <a href="recuperar_contraseña.html" class="text-blue-600 hover:underline">¿Olvidaste tu contraseña?</a>
  </section>

</body>
</html>
